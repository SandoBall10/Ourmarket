services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplaceinmobiliario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplaceinmobiliario"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: inmomarket-backend:${IMAGE_TAG:-local}
    build:
      context: backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/marketplaceinmobiliario
      DB_USERNAME: postgres
      DB_PASSWORD: demo_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/marketplaceinmobiliario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: demo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: inmomarket-frontend:${IMAGE_TAG:-local}
    build:
      context: frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
